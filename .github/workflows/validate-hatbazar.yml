name: Validate Hatbazar frontend

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, hatbazar/checkout-audit]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Hatbazar release-critical invariants
        run: python3 scripts/validate-hatbazar.py
      - name: Check inline JavaScript syntax
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script\b[^>]*>([\s\S]*?)</script\s*>", html, flags=re.I)
          inline = [s for s in scripts if s.strip() and not re.match(r"\s*$", s)]
          if not inline:
              raise SystemExit("No inline JavaScript blocks found")
          for i, script in enumerate(inline, 1):
              Path(f"/tmp/hatbazar-inline-{i}.js").write_text(script, encoding="utf-8")
          print(f"Extracted {len(inline)} inline script block(s)")
          PY
          for file in /tmp/hatbazar-inline-*.js; do
            node --check "$file"
          done
